name: Cleanup Old Releases

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete releases older than 7 days
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          export cutoff
          echo "Cutoff: $cutoff"
          gh release list -R "${{ github.repository }}" -L 1000 \
            --json tagName,publishedAt,isDraft \
            --jq '.[] | select(.publishedAt != null and .publishedAt < env.cutoff) | .tagName' \
            | while read -r tag; do
                echo "Deleting release/tag: $tag"
                gh release delete -R "${{ github.repository }}" "$tag" -y --cleanup-tag || true
              done
          echo "Cleanup done."