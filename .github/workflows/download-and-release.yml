name: Download & Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'urls.txt'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Download files from urls.txt
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          : > success.txt

          pick_name() {
            local f="$1" i=2 stem ext cand
            f="${f%%\#*}"
            f="${f%%\?*}"
            f="${f##*/}"
            [ -z "$f" ] && f="file"
            stem="${f%.*}"
            ext="${f##*.}"
            if [ -e "downloads/$f" ]; then
              while :; do
                if [ "$f" = "$ext" ]; then
                  cand="${stem}-${i}"
                else
                  cand="${stem}-${i}.${ext}"
                fi
                [ ! -e "downloads/$cand" ] && { f="$cand"; break; }
                i=$((i+1))
              done
            fi
            printf '%s' "$f"
          }

          while IFS= read -r line || [ -n "$line" ]; do
            url="$line"
            url="${url#"${url%%[![:space:]]*}"}"
            url="${url%"${url##*[![:space:]]}"}"
            case "$url" in ""|\#*) continue ;; esac
            fname="$(pick_name "$url")"
            echo "Downloading: $url -> downloads/$fname"
            if curl -fL --retry 3 --connect-timeout 10 -o "downloads/$fname" -- "$url"; then
              echo "$line" >> success.txt
            else
              rm -f "downloads/$fname"
              echo "FAILED (kept in urls.txt): $url"
            fi
          done < urls.txt

      - name: Create release and upload assets
        run: |
          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "No files downloaded, skipping release."
            exit 0
          fi
          TAG="download-$(date +%Y%m%d%H%M%S)-$RANDOM"
          gh release create "$TAG" downloads/* \
            --title "Downloaded files $TAG" \
            --notes "Files downloaded from urls.txt via workflow_dispatch"

      - name: Clear successful URLs from urls.txt and commit
        run: |
          if [ -s success.txt ]; then
            grep -vxFf success.txt urls.txt > urls.tmp || true
            mv urls.tmp urls.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urls.txt
          git commit -m "ci: clear processed download URLs" || true
          git push